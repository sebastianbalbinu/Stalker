name: Revisar que compile y abra (rama de prueba, sin publicar)

on:
  push:
    branches: [melomano]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: gradle :app:assembleRelease --no-daemon
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Abrir la app en un emulador y ver que no se cierre
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: false
          script: |
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell pm grant com.sebas.stalker android.permission.READ_MEDIA_AUDIO || true
            adb shell pm grant com.sebas.stalker android.permission.POST_NOTIFICATIONS || true
            adb logcat -c
            adb shell am start -W -n com.sebas.stalker/.MainActivity
            sleep 20
            adb shell input tap 540 2200 || true
            sleep 5
            adb exec-out screencap -p > pantalla.png
            adb logcat -d > logcat.txt
            grep -E "FATAL EXCEPTION|AndroidRuntime" -A 30 logcat.txt && exit 1 || true
            adb shell pidof com.sebas.stalker
            curl -s -A "Stalker/1.4 ( https://github.com/sebastianbalbinu/Stalker )" "https://musicbrainz.org/ws/2/release-group/?query=releasegroup:%22Rumours%22%20AND%20artist:%22Fleetwood%20Mac%22&limit=2&fmt=json" | head -c 500; echo
            curl -s -o /dev/null -w "caa %{http_code} %{redirect_url}\n" "https://coverartarchive.org/release-group/7f00ef53-7b65-3a1a-87a5-db8e2c5a6b80/front-1200"
            curl -s "https://www.wikidata.org/w/api.php?action=wbgetentities&ids=Q213734&props=sitelinks&sitefilter=eswiki|enwiki&format=json" | head -c 300; echo

