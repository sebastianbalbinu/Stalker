name: Revisar abrir con Stalker (rama de prueba, sin publicar)

on:
  push:
    branches: [abrir-con]

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: gradle :app:assembleRelease --no-daemon
      - name: Archivos de prueba
        run: |
          sudo apt-get install -y -qq ffmpeg zip >/dev/null
          ffmpeg -loglevel error -f lavfi -i "sine=frequency=440:duration=50" -ar 44100 -metadata title="Prueba Suelta" -metadata artist="Stalker Test" -metadata album="Suelta" prueba.flac
          ffmpeg -loglevel error -f lavfi -i "sine=frequency=660:duration=50" -ar 44100 -metadata title="Del Disco" -metadata artist="Stalker Test" -metadata album="Disco Zip" pista1.flac
          zip -q disco.bin pista1.flac
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Abrir una canción y un zip genérico con Stalker
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell pm grant com.sebas.stalker android.permission.READ_MEDIA_AUDIO || true
            adb shell pm grant com.sebas.stalker android.permission.POST_NOTIFICATIONS || true
            adb push prueba.flac /sdcard/Download/prueba.flac
            adb push disco.bin /sdcard/Download/disco.bin
            adb logcat -c
            adb shell am start -W -a android.intent.action.VIEW -d file:///sdcard/Download/prueba.flac -t audio/flac -n com.sebas.stalker/.MainActivity
            sleep 15
            adb shell am start -W -a android.intent.action.VIEW -d file:///sdcard/Download/disco.bin -t application/octet-stream -n com.sebas.stalker/.MainActivity
            sleep 15
            adb shell content query --uri content://media/external/audio/media --projection _display_name:relative_path | grep -i stalker || true
            adb shell dumpsys media_session | grep -i -E "state=|description=" | head -5 || true
            adb logcat -d > logcat.txt
            grep -E "FATAL EXCEPTION" -A 30 logcat.txt && exit 1 || true
            adb shell pidof com.sebas.stalker
