name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build-log.txt

      - name: Publicar registro si falla
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: log-${{ github.run_number }}
          name: Registro de error ${{ github.run_number }}
          prerelease: true
          files: build-log.txt

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk Stalker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Stalker
          path: Stalker.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.${{ github.run_number }}
          name: Stalker 1.2.${{ github.run_number }}
          body: APK lista para instalar en el celular.
          files: Stalker.apk
